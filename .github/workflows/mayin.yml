name: Kernel Builder2

on:
  workflow_dispatch:
    inputs:
      kernel_url:
        description: 'رابط مصدر النواة (Git URL)'
        required: true
        default: 'https://github.com/SPEEDFIRE7/kernel_oppo_CPH2185'
      kernel_branch:
        description: 'الفرع (فارغ = الافتراضي)'
        required: false
        default: ''
      defconfig:
        description: 'اسم defconfig'
        required: true
        default: 'oppo6765_defconfig'
      clang_branch:
        description: 'فرع AOSP لـ clang'
        required: true
        default: 'android10-release'
      clang_dir:
        description: 'مجلد clang داخل المستودع'
        required: true
        default: 'clang-r353983c'
      gcc_branch:
        description: 'فرع AOSP لـ gcc 4.9'
        required: true
        default: 'android10-release'
      add_ksu:
        description: 'إضافة KernelSU Next (hooks يدوية)'
        type: boolean
        default: false
      ksu_setup_url:
        description: 'رابط setup.sh لـ KernelSU Next'
        required: false
        default: 'https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh'
      ksu_ref:
        description: 'فرع KernelSU Next (legacy لنوى 4.9)'
        required: false
        default: 'legacy'
      make_zip:
        description: 'إنشاء zip قابل للفلاش (AnyKernel3)'
        type: boolean
        default: true
      weak_tp_stub:
        description: 'إضافة تعريف ضعيف (weak) لدالة lcd_queue_load_tp_fw المفقودة'
        type: boolean
        default: false
      upload_gofile:
        description: 'رفع الناتج إلى Gofile'
        type: boolean
        default: true
      extra_make_args:
        description: 'معاملات make إضافية (اختياري)'
        required: false
        default: ''

env:
  ARCH: arm64
  SUBARCH: arm64
  TZ: Asia/Riyadh
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: 'true'
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 3G

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: تحرير مساحة القرص وتثبيت الأدوات
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev make gcc g++ cpio \
            git curl wget zip unzip xz-utils lz4 python3 python-is-python3 \
            device-tree-compiler ccache libncurses-dev dos2unix
          df -h /

      - name: تنزيل مصدر النواة
        run: |
          BR=""
          if [ -n "${{ inputs.kernel_branch }}" ]; then BR="-b ${{ inputs.kernel_branch }}"; fi
          for i in 1 2 3; do
            git clone --depth=1 $BR "${{ inputs.kernel_url }}" kernel && break
            echo "فشل التنزيل (محاولة $i)، إعادة المحاولة..."; rm -rf kernel; sleep 5
          done
          [ -d kernel ] || { echo "::error::تعذر تنزيل السورس"; exit 1; }
          cd kernel
          echo "Commit: $(git log -1 --format='%h %s')"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' Makefile | head -3

      - name: استعادة كاش الـ toolchains
        id: tc
        uses: actions/cache@v4
        with:
          path: |
            clang-repo
            gcc64
            gcc32
          key: tc-${{ inputs.clang_branch }}-${{ inputs.clang_dir }}-${{ inputs.gcc_branch }}

      - name: تنزيل Clang و GCC
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --filter=blob:none --sparse \
            -b "${{ inputs.clang_branch }}" \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-repo
          git -C clang-repo sparse-checkout set "${{ inputs.clang_dir }}"
          git clone --depth=1 -b "${{ inputs.gcc_branch }}" \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 -b "${{ inputs.gcc_branch }}" \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

      - name: إعداد البيئة
        run: |
          echo "$GITHUB_WORKSPACE/clang-repo/${{ inputs.clang_dir }}/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/gcc64/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/gcc32/bin" >> $GITHUB_PATH
          echo "KBUILD_BUILD_USER=builder" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=github-actions" >> $GITHUB_ENV
          "$GITHUB_WORKSPACE/clang-repo/${{ inputs.clang_dir }}/bin/clang" --version | head -1

      - name: استعادة كاش ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ inputs.defconfig }}-${{ inputs.add_ksu }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.defconfig }}-${{ inputs.add_ksu }}-
            ccache-${{ inputs.defconfig }}-

      - name: إيجاد defconfig
        working-directory: kernel
        run: |
          DEF="${{ inputs.defconfig }}"
          if [ -f "arch/arm64/configs/$DEF" ]; then
            echo "defconfig موجود في arch/arm64/configs"
          else
            F=$(find arch -name "$DEF" | head -1)
            [ -z "$F" ] && { echo "::error::لم يتم العثور على $DEF"; exit 1; }
            echo "وجد في: $F"
            cp "$F" arch/arm64/configs/
          fi

      - name: إضافة KernelSU Next
        if: ${{ inputs.add_ksu }}
        working-directory: kernel
        run: |
          curl -fLSs "${{ inputs.ksu_setup_url }}" -o ksu_setup.sh \
            || { echo "::error::رابط setup.sh غير صالح (404)"; exit 1; }
          bash ksu_setup.sh "${{ inputs.ksu_ref }}"
          rm -f ksu_setup.sh
          ls -d KernelSU* || { echo "::error::فشل إضافة KernelSU"; exit 1; }

          # نوى 4.9 تفتقد هيدرات جديدة (compiler_types.h و sched/*.h ...)
          # نفحص كل #include <linux/...> في كود KernelSU وننشئ shim لما هو ناقص
          mkdir -p include/linux/sched
          grep -rhoE '#include <linux/[A-Za-z0-9_/.-]+\.h>' KernelSU-Next/kernel \
            | sed -E 's/#include <(.*)>/\1/' | sort -u | while read -r h; do
            [ -f "include/$h" ] && continue
            case "$h" in
              linux/compiler_types.h)
                INC="linux/compiler.h" ;;
              linux/sched/*.h)
                INC="linux/sched.h" ;;
              *)
                echo "::warning::هيدر ناقص بدون shim تلقائي: $h"; continue ;;
            esac
            G="_SHIM_$(echo "$h" | tr 'a-z/.' 'A-Z__')"
            mkdir -p "include/$(dirname "$h")"
            printf '#ifndef %s\n#define %s\n#include <%s>\n#endif\n' "$G" "$G" "$INC" > "include/$h"
            echo "shim: include/$h -> <$INC>"
          done

      - name: توافق 4.9 (kvmalloc)
        if: ${{ inputs.add_ksu }}
        working-directory: kernel
        run: |
          python3 - <<'PYEOF'
          import pathlib, re
          COMPAT = """
          #include <linux/version.h>
          #include <linux/slab.h>
          #include <linux/vmalloc.h>
          #if LINUX_VERSION_CODE < KERNEL_VERSION(4, 12, 0)
          #ifndef KSU_COMPAT_KVMALLOC
          #define KSU_COMPAT_KVMALLOC
          static inline void *kvmalloc(size_t size, gfp_t flags)
          {
          \tvoid *p;
          \tif (size <= PAGE_SIZE)
          \t\treturn kmalloc(size, flags);
          \tp = kmalloc(size, flags | __GFP_NOWARN | __GFP_NORETRY);
          \tif (p)
          \t\treturn p;
          \treturn __vmalloc(size, flags | __GFP_HIGHMEM, PAGE_KERNEL);
          }
          #endif
          #endif
          """
          n = 0
          for f in pathlib.Path("KernelSU-Next/kernel").rglob("*.c"):
              t = f.read_text(errors="surrogateescape")
              if "kvmalloc(" not in t or "KSU_COMPAT_KVMALLOC" in t:
                  continue
              lines = t.split("\n")
              last = max((i for i, l in enumerate(lines) if l.startswith("#include")), default=-1)
              lines.insert(last + 1, COMPAT)
              f.write_text("\n".join(lines), errors="surrogateescape")
              print("kvmalloc compat:", f)
              n += 1
          print("files patched:", n)
          PYEOF

      - name: تطبيق hooks اليدوية (fs/ + reboot)
        if: ${{ inputs.add_ksu }}
        working-directory: kernel
        run: |
          python3 - <<'PYEOF'
          import re, sys

          def read(p):
              return open(p, encoding="utf-8", errors="surrogateescape").read()

          def write(p, s):
              open(p, "w", encoding="utf-8", errors="surrogateescape").write(s)

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          def insert_before(s, anchor_re, text, start=0, label=""):
              m = re.compile(anchor_re, re.M).search(s, start)
              if not m:
                  fail(f"لم أجد الموضع المناسب ({label}) — عدّل هذا الملف يدويا")
              return s[:m.start()] + text + s[m.start():], m.start()

          def patch(path, fn):
              s = read(path)
              if "ksu_handle" in s:
                  print(f"[=] {path}: hooks موجودة مسبقا")
                  return
              s = fn(s)
              write(path, s)
              print(f"[+] {path}: تم")

          def exec_c(s):
              ext = ("#ifdef CONFIG_KSU\n__attribute__((hot))\n"
                     "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n"
                     "\t\t\t\tvoid *argv, void *envp, int *flags);\n#endif\n\n")
              s, pos = insert_before(s, r"^int do_execve\(struct filename \*filename,", ext, label="do_execve")
              call = "#ifdef CONFIG_KSU\n\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n#endif\n"
              ret = "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);"
              if s.count(ret) < 1:
                  fail("لم أجد return do_execveat_common في fs/exec.c")
              head, tail = s[:pos], s[pos:]
              tail = tail.replace(ret, call + ret)
              print(f"    exec.c: {tail.count('ksu_handle_execveat((int')} استدعاء")
              return head + tail

          def open_c(s):
              ext = ("#ifdef CONFIG_KSU\n__attribute__((hot))\n"
                     "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n"
                     "\t\t\t\tint *mode, int *flags);\n#endif\n\n")
              s, pos = insert_before(s, r"^SYSCALL_DEFINE3\(faccessat,", ext, label="faccessat")
              s, _ = insert_before(s, r"^\tif \(mode & ~S_IRWXO\)",
                  "#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n\n",
                  start=pos, label="faccessat body")
              return s

          def rw_c(s):
              ext = ("#ifdef CONFIG_KSU\nextern bool ksu_vfs_read_hook __read_mostly;\n"
                     "extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd,\n"
                     "\t\t\t\tchar __user **buf_ptr, size_t *count_ptr);\n#endif\n\n")
              s, pos = insert_before(s, r"^SYSCALL_DEFINE3\(read,", ext, label="sys_read")
              s, _ = insert_before(s, r"^\tif \(f\.file\) \{",
                  "#ifdef CONFIG_KSU\n\tif (unlikely(ksu_vfs_read_hook))\n\t\tksu_handle_sys_read(fd, &buf, &count);\n#endif\n",
                  start=pos, label="sys_read body")
              return s

          def stat_c(s):
              ext = ("#ifdef CONFIG_KSU\n__attribute__((hot))\n"
                     "extern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n"
                     "\t\t\t\tint *flags);\n#endif\n\n")
              s, pos = insert_before(s, r"^SYSCALL_DEFINE4\(newfstatat,", ext, label="newfstatat")
              s, _ = insert_before(s, r"^\terror = vfs_fstatat\(dfd, filename, &stat, flag\);",
                  "#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n",
                  start=pos, label="newfstatat body")
              return s

          def reboot_c(s):
              ext = ("#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n\n")
              s, pos = insert_before(s, r"^SYSCALL_DEFINE4\(reboot,", ext, label="reboot")
              s, _ = insert_before(s, r"^\t/\* We only trust the superuser with rebooting the system\. \*/",
                  "#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n",
                  start=pos, label="reboot body")
              return s

          patch("fs/exec.c", exec_c)
          patch("fs/open.c", open_c)
          patch("fs/read_write.c", rw_c)
          patch("fs/stat.c", stat_c)
          patch("kernel/reboot.c", reboot_c)
          PYEOF
          git diff --stat || true

      - name: ضبط defconfig لـ KernelSU
        if: ${{ inputs.add_ksu }}
        working-directory: kernel
        run: |
          DEF=arch/arm64/configs/${{ inputs.defconfig }}
          sed -i '/CONFIG_KSU/d;/CONFIG_KPROBES/d' "$DEF"
          {
            echo ""
            echo "# KernelSU Next"
            echo "CONFIG_KSU=y"
            if grep -q "KSU_MANUAL_HOOK" KernelSU-Next/kernel/Kconfig 2>/dev/null; then
              echo "CONFIG_KSU_MANUAL_HOOK=y"
            fi
            echo "# CONFIG_KPROBES is not set"
          } >> "$DEF"
          tail -6 "$DEF"

      - name: تشخيص lcd_queue_load_tp_fw
        working-directory: kernel
        run: |
          echo "---- أين تُعرَّف الدالة؟ ----"
          grep -rn "lcd_queue_load_tp_fw" --include=*.c --include=*.h . | grep -v "^./out/" | head -30 || true
          echo "---- خيارات اللمس في defconfig ----"
          grep -n -i "touchpanel\|TOUCH\|NT36\|NVT\|TP_" arch/arm64/configs/${{ inputs.defconfig }} | head -40 || true

      - name: تعريف ضعيف لـ lcd_queue_load_tp_fw (اختياري)
        if: ${{ inputs.weak_tp_stub }}
        working-directory: kernel
        run: |
          F=drivers/misc/mediatek/lcm/mt65xx_lcm_list.c
          [ -f "$F" ] || { echo "::error::لم أجد $F"; exit 1; }
          if ! grep -q "lcd_queue_load_tp_fw" "$F"; then
            printf '\n/* fallback: تعريف ضعيف يُستبدل إن وُجد تعريف حقيقي */\nvoid __attribute__((weak)) lcd_queue_load_tp_fw(void) {}\n' >> "$F"
            echo "تمت إضافة التعريف الضعيف إلى $F"
          fi

      - name: بناء النواة
        id: build
        working-directory: kernel
        run: |
          set -o pipefail
          ccache -z || true
          MAKE_ARGS=(
            O=out
            ARCH=arm64
            "CC=ccache clang"
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-android-
            CROSS_COMPILE_ARM32=arm-linux-androideabi-
          )
          START=$(date +%s)
          make "${MAKE_ARGS[@]}" "${{ inputs.defconfig }}" ${{ inputs.extra_make_args }}

          if [ "${{ inputs.add_ksu }}" = "true" ]; then
            grep -q "^CONFIG_KSU=y" out/.config \
              || { echo "::error::CONFIG_KSU لم يُفعَّل في .config (تحقق من Kconfig)"; exit 1; }
          fi

          make -j$(nproc --all) "${MAKE_ARGS[@]}" ${{ inputs.extra_make_args }} 2>&1 | tee ../build.log
          echo "secs=$(( $(date +%s) - START ))" >> $GITHUB_OUTPUT
          ccache -s || true

      - name: أخطاء البناء (عند الفشل)
        if: failure()
        run: |
          # السطر الذي يسبق "*** ... Error" هو السبب الحقيقي، لذلك نعرض ما قبله
          L=$(grep -n -E "\*\*\* .*(vmlinux|\.o|\.ko).*Error" build.log | head -1 | cut -d: -f1)
          [ -z "$L" ] && L=$(wc -l < build.log)
          S=$(( L > 40 ? L - 40 : 1 ))
          {
            echo "### ❌ فشل البناء — الأسطر قبل أول خطأ"
            echo '```'
            sed -n "${S},${L}p" build.log
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          echo "---- الأسطر ${S}-${L} ----"
          sed -n "${S},${L}p" build.log
          echo "---- كل الأخطاء ----"
          grep -n -E "error:|undefined reference|ld(\.lld)?:|No such file|cannot find|overlap|relocation" build.log | tail -30 || true

      - name: تجميع الملفات الناتجة
        run: |
          mkdir -p out_files
          B=kernel/out/arch/arm64/boot
          for f in Image Image.gz Image.gz-dtb Image-dtb Image.lz4 Image.lz4-dtb mtk.dtb; do
            [ -f "$B/$f" ] && cp "$B/$f" out_files/
          done
          find "$B/dts" -name '*.dtb' -exec cp {} out_files/ \; 2>/dev/null || true
          find "$B/dts" -name '*.dtbo' -exec cp {} out_files/ \; 2>/dev/null || true
          cp kernel/out/.config out_files/config
          ls -lh out_files
          [ -f "$B/Image" ] || { echo "::error::لم يتم إنتاج Image"; exit 1; }

      - name: إنشاء zip قابل للفلاش (AnyKernel3)
        if: ${{ inputs.make_zip }}
        continue-on-error: true
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3
          cd AK3
          rm -rf .git .github README.md modules patch ramdisk
          mkdir -p modules patch ramdisk
          # اختيار أفضل صورة للنواة
          for f in Image.gz-dtb Image.lz4-dtb Image.gz Image; do
            if [ -f ../out_files/$f ]; then cp ../out_files/$f ./ ; echo "الصورة: $f"; break; fi
          done
          sed -i 's/^do_devicecheck=.*/do_devicecheck=0/' anykernel.sh
          sed -i 's|^block=.*|block=boot;|' anykernel.sh
          sed -i 's/^is_slot_device=.*/is_slot_device=0;/' anykernel.sh
          sed -i 's/^kernel.string=.*/kernel.string=Custom Kernel (${{ inputs.defconfig }})/' anykernel.sh
          zip -r9 ../Kernel-flashable.zip . -x '*.git*'
          ls -lh ../Kernel-flashable.zip
          mv ../Kernel-flashable.zip ../out_files/

      - name: رفع الناتج إلى Gofile
        if: ${{ success() && inputs.upload_gofile }}
        continue-on-error: true
        run: |
          F=out_files/Kernel-flashable.zip
          [ -f "$F" ] || F=$(ls out_files/Image.gz-dtb out_files/Image.gz out_files/Image 2>/dev/null | head -1)
          # نضغط كل الناتج في ملف واحد أيضا
          (cd out_files && zip -r9 ../all-output.zip . >/dev/null)
          URL=""
          for f in "$F" all-output.zip; do
            [ -f "$f" ] || continue
            RES=""
            # المحاولة 1: نقطة الرفع العامة
            RES=$(curl -sf -F "file=@$f" https://upload.gofile.io/uploadfile || true)
            # المحاولة 2: اختيار سيرفر من القائمة
            if ! echo "$RES" | jq -e '.data.downloadPage' >/dev/null 2>&1; then
              SRV=$(curl -sf https://api.gofile.io/servers | jq -r '.data.servers[0].name' || true)
              [ -n "$SRV" ] && RES=$(curl -sf -F "file=@$f" "https://${SRV}.gofile.io/contents/uploadfile" || true)
            fi
            LINK=$(echo "$RES" | jq -r '.data.downloadPage // empty' 2>/dev/null || true)
            if [ -n "$LINK" ]; then
              echo "$f => $LINK"
              URL="$URL- $(basename "$f"): $LINK"$'\n'
            else
              echo "::warning::فشل رفع $f إلى Gofile: $RES"
            fi
          done
          if [ -n "$URL" ]; then
            { echo "### 🔗 روابط Gofile"; echo "$URL"; } >> $GITHUB_STEP_SUMMARY
          fi

      - name: ملخص البناء
        if: success()
        run: |
          S=${{ steps.build.outputs.secs }}
          {
            echo "### ✅ تم البناء"
            echo "- المصدر: ${{ inputs.kernel_url }}"
            echo "- defconfig: ${{ inputs.defconfig }}"
            echo "- KernelSU Next: ${{ inputs.add_ksu }}"
            echo "- مدة البناء: $((S/60)) دقيقة"
            echo '```'
            ls -lh out_files
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: رفع الناتج
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: out_files/*

      - name: رفع سجل البناء
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
